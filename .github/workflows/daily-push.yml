name: Daily AI Hot Push

on:
  schedule:
    # 每天 UTC 1:15 运行（对应中国时间 9:15）
    - cron: '15 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Print debug info
        run: |
          echo "Current UTC time: $(date -u)"
          echo "Current Beijing time: $(TZ='Asia/Shanghai' date)"
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
      
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      
      - name: Verify secrets
        run: |
          echo "BOT_TOKEN is set: ${{ secrets.BOT_TOKEN != '' }}"
          echo "CHAT_ID is set: ${{ secrets.CHAT_ID != '' }}"
          if [ -z "${{ secrets.BOT_TOKEN }}" ]; then echo "❌ BOT_TOKEN is missing!"; exit 1; fi
          if [ -z "${{ secrets.CHAT_ID }}" ]; then echo "❌ CHAT_ID is missing!"; exit 1; fi
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          CHAT_ID=${{ secrets.CHAT_ID }}
          SCHEDULED_TIME=09:15
          AIHOT_URL=https://aihot.virxact.com
          PUSH_MODE=daily
          EOF
          
          echo "✅ .env file created successfully"
      
      - name: Run push with retry
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_seconds: 30
          command: node bot.js test
